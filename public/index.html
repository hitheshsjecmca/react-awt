<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Book Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Online Book Management System</h1>

    <div id="message" class="message hidden"></div>

    <form id="bookForm">
      <input type="hidden" id="bookId" />
      <input type="text" id="title" placeholder="Title" required />
      <input type="text" id="author" placeholder="Author" required />
      <input type="number" id="price" placeholder="Price" min="0" step="any" required />
      <button type="submit" id="submitBtn">Add Book</button>
      <button type="button" id="cancelBtn" class="secondary hidden">Cancel</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Author</th>
          <th>Price (₹)</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="bookList"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
